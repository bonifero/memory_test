# nginx inside the frontend container: serves the SPA and proxies the API to the backend
# over the Docker network. The host nginx only needs to proxy the domain to 127.0.0.1:9096.

upstream backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Public API (test results submission).
    location /api/ {
        proxy_pass http://backend;
    }

    # Admin API under /admin/ so the browser reuses Basic credentials of the admin page.
    # Trailing slash in proxy_pass replaces the /admin/api/ prefix with /api/admin/.
    location /admin/api/ {
        proxy_pass http://backend/api/admin/;
    }

    # Admin page: Basic auth is checked by the backend via auth_request
    # (its 401 with WWW-Authenticate is passed to the browser as is).
    location /admin {
        auth_request /_auth;
        try_files $uri /index.html;
    }

    location = /_auth {
        internal;
        proxy_pass http://backend/api/admin/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
